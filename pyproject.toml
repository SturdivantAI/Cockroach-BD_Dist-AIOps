[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "evaluation", "frontend"]

[project]
name = "sre-memory-agent"
version = "0.1.0"
description = "Distributed AI SRE Assistant with Agentic Memory — CockroachDB + AWS Bedrock + Databricks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "SturdivantAI Lab" },
]

dependencies = [
    "boto3>=1.35.0",
    "psycopg[binary]>=3.2.0",
    "streamlit>=1.38.0",
    "langchain-aws>=0.2.0",
    "langchain-core>=0.3.0",
    "databricks-sdk>=0.30.0",
    "mlflow>=2.16.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "black>=24.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
